name: Publicar la app

on:
  push:
    branches: [main]
  workflow_run:                      # republica cuando la ingesta trae datos nuevos
    workflows: ["Actualizar datos meta"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # npm ci, no npm install: instala EXACTAMENTE lo que dice el lockfile.
      # Con npm install, una version menor mala de una dependencia entraba sola
      # en el despliegue, y eso es indepurable desde el movil.
      - run: npm ci

      - name: Ingesta
        # Sin continue-on-error: si la ingesta revienta, el despliegue debe
        # fallar. Con el, se publicaba la app nueva con los datos congelados del
        # despliegue anterior y no habia forma de notarlo salvo mirando la hora.
        #
        # A un temporal: hasta saber que esta corrida no es peor que la
        # guardada, los datos buenos no se tocan.
        run: node scripts/ingest.mjs --rank glory --days 7 --out /tmp/nueva.json

      - name: Descartar la corrida si resuelve menos que la guardada
        # Reventar es facil de ver; degradarse no. La ingesta conserva los datos
        # anteriores cuando un endpoint falla, asi que una corrida mala pasaba
        # la comprobacion de frescura y se publicaba: 133 heroes con linea y rol
        # a 0, y los counters de 133 a 34. Cuatro de las cinco lineas se quedan
        # sin pool y la app no tiene con que quejarse.
        run: node scripts/comparar-ingesta.mjs /tmp/nueva.json public/data/roam-meta.json

      - name: Guardar la corrida buena
        run: cp /tmp/nueva.json public/data/roam-meta.json

      - name: Comprobar que los datos son de ahora
        run: |
          node -e "const d=require('./public/data/roam-meta.json');
          const h=(Date.now()-new Date(d.generatedAt))/3.6e6;
          console.log('generado hace', h.toFixed(2), 'h -', d.heroCount ?? 0, 'heroes');
          if (h > 0.5) { console.error('Los datos no se han regenerado'); process.exit(1); }
          if (!(d.heroCount ?? 0)) { console.error('Sin estadisticas'); process.exit(1); }"


      - name: Comprobar que la versión está documentada
        run: node scripts/check-version.mjs

      - name: Comprobar orden de declaraciones
        run: node scripts/check-order.mjs src/App.jsx src/components/ui.jsx

      - name: Comprobar estilos
        run: node scripts/check-css.mjs

      - name: Pruebas del motor
        run: node scripts/test-engine.mjs

      - name: Compilar
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
