name: Publicar la app

on:
  push:
    branches: [main]
  workflow_run:                      # republica cuando la ingesta trae datos nuevos
    workflows: ["Actualizar datos meta"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Ingesta (para que la primera publicación ya lleve datos)
        run: node scripts/ingest.mjs --rank mythic --days 7
        continue-on-error: true

      - name: Comprobar orden de declaraciones
        run: node scripts/check-order.mjs src/App.jsx src/components/ui.jsx

      - name: Compilar
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
