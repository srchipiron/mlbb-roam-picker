name: Publicar la app

on:
  push:
    branches: [main]
  workflow_run:                      # republica cuando la ingesta trae datos nuevos
    workflows: ["Actualizar datos meta"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # npm ci, no npm install: instala EXACTAMENTE lo que dice el lockfile.
      # Con npm install, una version menor mala de una dependencia entraba sola
      # en el despliegue, y eso es indepurable desde el movil.
      - run: npm ci

      - name: Ingesta
        # A un temporal: hasta saber que esta corrida no es peor que la
        # guardada, los datos buenos no se tocan.
        #
        # Y con continue-on-error, que NO es lo que habia antes: antes el paso
        # escribia encima de public/data, asi que dejarlo fallar publicaba la
        # app nueva con datos congelados sin ninguna senal. Ahora escribe a un
        # temporal y quien decide es el paso de abajo, mirando lo que hay.
        id: ingesta
        continue-on-error: true
        # Tope de tiempo, porque "fallar" ya lo cubre continue-on-error pero
        # "colgarse" no: la ingesta hace ~570 peticiones con 15 s de timeout
        # cada una, asi que con la API caida a medias puede tardar 140 minutos
        # y el despliegue se queda ahi aunque ya sepa publicar con los datos del
        # repositorio. Lo normal medido son 9-10 minutos; 20 deja margen doble.
        # Un timeout cuenta como fallo, y el paso de abajo hace lo de siempre.
        timeout-minutes: 20
        run: node scripts/ingest.mjs --rank glory --days 7 --out /tmp/nueva.json

      - name: Elegir con qué datos se publica
        # Tres casos:
        #   la corrida nueva es buena     -> se usa
        #   es peor, o la API esta caida  -> se usan los datos del repositorio,
        #                                    que pasaron este mismo filtro el dia
        #                                    que se commitearon
        #   ademas estan rancios          -> se para el despliegue
        #
        # Antes, con la API caida no se podia publicar NINGUN cambio de codigo
        # aunque el repositorio tuviera datos perfectos. Paso de verdad: el
        # despliegue de 1.6.0 se quedo sin publicar por un UPSTREAM_REQUEST_FAILED
        # que no tenia nada que ver con el codigo que se subia.
        run: |
          if [ "${{ steps.ingesta.outcome }}" = "success" ] \
             && node scripts/comparar-ingesta.mjs /tmp/nueva.json public/data/roam-meta.json; then
            cp /tmp/nueva.json public/data/roam-meta.json
            echo "Se publica con la corrida nueva."
          else
            echo "::warning::La ingesta ha fallado o resuelve menos; se publica con los datos del repositorio."
          fi

      - name: Comprobar que los datos valen para publicar
        # El limite de horas es lo que sustituye a "regenerado hace menos de
        # media hora". Un winrate de una ventana de 7 dias no se mueve en un
        # dia; a los tres ya es otra cosa, y publicar eso seria mentir.
        run: |
          node -e "const d=require('./public/data/roam-meta.json');
          const h=(Date.now()-new Date(d.generatedAt))/3.6e6;
          const cruces=Object.values(d.counters??{}).reduce((n,f)=>n+Object.keys(f??{}).length,0);
          console.log('datos generados hace', h.toFixed(1), 'h ·', d.heroCount ?? 0, 'heroes ·', cruces, 'cruces');
          if (h > 72) { console.error('Los datos tienen mas de 72 horas: no se publica'); process.exit(1); }
          if (!(d.heroCount ?? 0)) { console.error('Sin estadisticas'); process.exit(1); }
          if (cruces < 1000) { console.error('Sin matriz de counters'); process.exit(1); }"

      - name: Comprobar que la versión está documentada
        run: node scripts/check-version.mjs

      - name: Comprobar orden de declaraciones
        run: node scripts/check-order.mjs src/App.jsx src/components/ui.jsx

      - name: Comprobar estilos
        run: node scripts/check-css.mjs

      - name: Pruebas del motor
        run: node scripts/test-engine.mjs

      - name: Compilar
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
