name: Actualizar datos meta

on:
  schedule:
    - cron: '17 5,17 * * *'   # dos veces al día (UTC)
  workflow_dispatch:           # y a mano cuando cae un parche

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Ingesta
        # A un temporal, no encima de los datos buenos: si esta corrida sale
        # peor, los de antes tienen que seguir intactos para poder compararlos.
        # Con tope de tiempo: con la API a medias puede tardar 140 minutos.
        timeout-minutes: 20
        run: node scripts/ingest.mjs --rank glory --days 7 --out /tmp/nueva.json

      - name: Descartar la corrida si resuelve menos que la guardada
        # La ingesta se degrada en silencio y por diseño. Sin esto, el bot
        # commiteaba la corrida mala igual: paso de 133 heroes con linea y rol
        # a 0, y de 133 counters a 34, sin que nada avisara.
        run: node scripts/comparar-ingesta.mjs /tmp/nueva.json public/data/roam-meta.json

      - name: Guardar la corrida buena
        run: cp /tmp/nueva.json public/data/roam-meta.json

      - name: Avisar de héroes nuevos sin tags
        run: |
          NUEVOS=$(node -e "const d=require('./public/data/roam-meta.json');console.log((d.newHeroes||[]).join(', '))")
          if [ -n "$NUEVOS" ]; then
            echo "::warning::Héroes sin tags en heroes.json: $NUEVOS"
          fi

      - name: Commit si hay cambios
        run: |
          git config user.name  "meta-bot"
          git config user.email "meta-bot@users.noreply.github.com"
          # Los iconos van con los datos: un objeto nuevo entra en las builds y
          # su imagen tiene que entrar en el mismo commit, o la app pide un
          # fichero que no existe. Se anaden AQUI, despues de la comparacion,
          # para que una corrida descartada no deje basura.
          git add public/data/roam-meta.json public/objetos
          git diff --staged --quiet || git commit -m "datos: meta $(date -u +%Y-%m-%d)"
          git push
